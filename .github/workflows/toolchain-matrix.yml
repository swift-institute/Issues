# The toolchain matrix of a "Toolchain bug" record, run on CI (UPSTREAM-PROCEDURE.md, step 4).
#
# Runs the record's minimal reproduction on each named toolchain on a hosted
# macOS runner. `xcode-<version>` uses the runner's selected Xcode (recorded,
# never assumed to be that version); every other name is installed through
# swiftly. Posts the table as a comment on the issue. The Institute treats CI
# as the evidence of record, so a record's matrix comes from this run, not
# from a developer machine.
#
# Wiring only: classification is `issue-check --matrix` in Tooling/. Pin
# boundary as in upstream-readiness.yml.

name: toolchain-matrix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      toolchains:
        description: Comma-separated, e.g. 6.4.x-snapshot-2026-10-20,xcode-27.2,6.4.1,main-snapshot-2026-10-17
        required: true

permissions:
  contents: read

concurrency:
  group: toolchain-matrix-${{ inputs.issue }}
  cancel-in-progress: true

jobs:
  matrix:
    name: toolchain-matrix / issue-check
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      TOOLCHAINS_LIST: ${{ inputs.toolchains }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the runner
        run: |
          echo "Runner image: $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install swiftly
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
          pkgutil --check-signature "$RUNNER_TEMP/swiftly.pkg" | tee -a "$GITHUB_STEP_SUMMARY" \
            | grep -q "signed by a developer certificate issued by Apple"
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Install the toolchains
        run: |
          for toolchain in ${TOOLCHAINS_LIST//,/ }; do
            case "$toolchain" in
              xcode*) ;;
              *) swiftly install "$toolchain" --assume-yes ;;
            esac
          done
      - name: Build issue-check
        run: swift build -c release --package-path Tooling --product issue-check
      - name: Matrix
        run: Tooling/.build/release/issue-check "$ISSUE" --repo "$GITHUB_REPOSITORY" --matrix "$TOOLCHAINS_LIST" --post | tee -a "$GITHUB_STEP_SUMMARY"
