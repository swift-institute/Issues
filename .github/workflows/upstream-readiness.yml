# Gate for the upstream-ready and upstream-filed labels (UPSTREAM-PROCEDURE.md).
#
# When either label is added, or a labelled issue is edited, this runs
# `issue-check <issue> --run --enforce` from Tooling/. The check reads the
# "Toolchain bug" form fields, rejects the label unless every required field
# is present and consistent, then runs the minimal reproduction on the
# toolchain the issue names (installed through swiftly) and requires the
# recorded signature. On failure it removes the label and says why in one
# comment it keeps up to date; on success it records the verified toolchain
# in that comment.
#
# Wiring only: every verdict is Swift in Tooling/Sources. Pin boundary:
# actions/checkout is SHA-pinned; swiftly.pkg is downloaded from swift.org and
# must carry an Apple-issued Developer ID signature (checked and recorded);
# swiftly verifies each toolchain it installs; the hosted runner image is
# unpinnable and is recorded per run.
#
# Governance: like issue-105-toolchain-recheck.yml, a bespoke workflow in a
# control-plane repository, outside the generated-caller topology; its typed
# whitelist entry belongs in swift-institute/.github repository-policy.

name: upstream-readiness

on:
  issues:
    types: [labeled, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to check
        required: true

permissions:
  contents: read

concurrency:
  group: upstream-readiness-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  check:
    name: upstream-readiness / issue-check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
        (github.event.label.name == 'upstream-ready' || github.event.label.name == 'upstream-filed')) ||
      (github.event.action == 'edited' &&
        (contains(github.event.issue.labels.*.name, 'upstream-ready') ||
         contains(github.event.issue.labels.*.name, 'upstream-filed')))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the runner
        run: |
          echo "Runner image: $ImageOS $ImageVersion" | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun swiftc --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install swiftly
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
          pkgutil --check-signature "$RUNNER_TEMP/swiftly.pkg" | tee -a "$GITHUB_STEP_SUMMARY" \
            | grep -q "signed by a developer certificate issued by Apple"
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          "$HOME/.swiftly/bin/swiftly" init --assume-yes --skip-install --quiet-shell-followup
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"
      - name: Build issue-check
        run: swift build -c release --package-path Tooling --product issue-check
      - name: Install the stated toolchain
        run: |
          toolchain="$(Tooling/.build/release/issue-check "$ISSUE" --repo "$GITHUB_REPOSITORY" --print-toolchain)"
          case "$toolchain" in
            xcode-*|"") echo "No swiftly toolchain stated ('$toolchain'); issue-check will report it." ;;
            *) swiftly install "$toolchain" --assume-yes ;;
          esac
      - name: Check
        run: Tooling/.build/release/issue-check "$ISSUE" --repo "$GITHUB_REPOSITORY" --run --enforce
