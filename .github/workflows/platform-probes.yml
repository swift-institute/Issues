name: platform-probes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release-fso:
    name: "Issues#86 · Linux 6.4 release · swift-rfc-6068, swift-rfc-2369"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.4.0-noble", "swiftlang/swift:nightly-6.4.x-noble"]
    container: ${{ matrix.image }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assertions in this compiler
        shell: bash
        run: |
          f="$(dirname "$(readlink -f "$(command -v swift)")")/swift-frontend"
          for text in '!type.hasTypeParameter()' 'Forming a CanType out of a non-canonical type' 'witness has more effects than requirement' 'cannot deserialize shared function' 'constructing SILType with type that should have been' 'Instruction does not dominate all uses'; do
            echo "$text: $(grep -c -a -F "$text" "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Probe
        shell: bash
        run: |
          swift --version
          for repo in swift-ietf/swift-rfc-6068 swift-ietf/swift-rfc-2369; do
            name="${repo#*/}"
            git clone -q "https://github.com/$repo.git" "$RUNNER_TEMP/$name"
            bash .github/workflows/probe.sh "$name release" "$RUNNER_TEMP/$name" 2400 \
              'hasTypeParameter|SILArgument.cpp|FunctionSignatureOpts' \
              swift build -c release
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-86-${{ strategy.job-index }}
          path: ${{ runner.temp }}/probe-logs

  linux-stack-nesting:
    name: "Issues#85 · Linux 6.4 · io_uring probe shape from 66fea99"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.4.0-noble", "swiftlang/swift:nightly-6.4.x-noble"]
    container: ${{ matrix.image }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assertions in this compiler
        shell: bash
        run: |
          f="$(dirname "$(readlink -f "$(command -v swift)")")/swift-frontend"
          for text in '!type.hasTypeParameter()' 'Forming a CanType out of a non-canonical type' 'witness has more effects than requirement' 'cannot deserialize shared function' 'constructing SILType with type that should have been' 'Instruction does not dominate all uses'; do
            echo "$text: $(grep -c -a -F "$text" "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: System libraries
        run: apt-get update -qq && apt-get install -y -qq uuid-dev > /dev/null
      - name: Probe
        shell: bash
        run: |
          swift --version
          d=swift-issue-stacknesting-catch-pattern-noncopyable-discard
          sig='StackNesting|fixNesting|MandatoryAllocBoxToStack'
          cp "$d/Reduced.swift.txt" "$RUNNER_TEMP/Reduced.swift"
          bash .github/workflows/probe.sh "neutral reduction -Onone" "$RUNNER_TEMP" 600 "$sig" swiftc -parse-as-library -Onone -c Reduced.swift -o Reduced.o
          bash .github/workflows/probe.sh "neutral reduction -O" "$RUNNER_TEMP" 600 "$sig" swiftc -parse-as-library -O -c Reduced.swift -o Reduced.o
          git clone -q https://github.com/swift-linux-foundation/swift-linux-standard.git "$RUNNER_TEMP/sls"
          git -C "$RUNNER_TEMP/sls" log -1 --format='swift-linux-standard main %H'
          file="$RUNNER_TEMP/sls/Tests/Linux Kernel Standard Tests/Linux.Kernel.IO.Uring Tests.swift"
          perl "$d/restore-original-probe.pl" < "$file" > "$file.new" && mv "$file.new" "$file"
          git -C "$RUNNER_TEMP/sls" diff --stat
          bash .github/workflows/probe.sh "swift-linux-standard main with the 66fea99 probe, debug" "$RUNNER_TEMP/sls" 1800 "$sig" \
            swift build --build-tests
          bash .github/workflows/probe.sh "swift-linux-standard main with the 66fea99 probe, release" "$RUNNER_TEMP/sls" 1800 "$sig" \
            swift build --build-tests -c release -Xswiftc -enable-testing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-85-${{ strategy.job-index }}
          path: ${{ runner.temp }}/probe-logs

  linux-release-cmo:
    name: "Issues#58 · Linux 6.4 release · swift-sql"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["swift:6.4.0-noble", "swiftlang/swift:nightly-6.4.x-noble"]
    container: ${{ matrix.image }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assertions in this compiler
        shell: bash
        run: |
          f="$(dirname "$(readlink -f "$(command -v swift)")")/swift-frontend"
          for text in '!type.hasTypeParameter()' 'Forming a CanType out of a non-canonical type' 'witness has more effects than requirement' 'cannot deserialize shared function' 'constructing SILType with type that should have been' 'Instruction does not dominate all uses'; do
            echo "$text: $(grep -c -a -F "$text" "$f")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Probe
        shell: bash
        run: |
          swift --version
          git clone -q https://github.com/swift-compositions/swift-sql.git "$RUNNER_TEMP/swift-sql"
          bash .github/workflows/probe.sh "swift-sql release" "$RUNNER_TEMP/swift-sql" 3600 \
            'forAbstract|cannot deserialize shared function|Stack dump|signal [0-9]+' \
            swift build -c release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-58-${{ strategy.job-index }}
          path: ${{ runner.temp }}/probe-logs

  windows-debuginfo:
    name: "Issues#21 · Windows 6.4 debug · cross-package existential"
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: "6.4"
          cache-snapshot: false
      - name: Probe
        shell: bash
        run: |
          swift --version
          evidence="swift-issue-protocol-typealias-parent-noncanonical/evidence"
          base="$RUNNER_TEMP/other-package"
          cp -R "$evidence/fixtures/other-package" "$base"
          git -C "$base" init -q -b main
          git -C "$base" add -A
          git -C "$base" -c user.name=probe -c user.email=probe@example.com commit -qm fixture
          git -C "$base" tag 0.2.0
          primary="$RUNNER_TEMP/primary"
          cp -R "$evidence/source-package/primary" "$primary"
          url="file:///$(cygpath -m "$base")"
          sed -i "s|https://github.com/coenttb/swift-issue-windows-existential-crash-other-package|$url|" "$primary/Package.swift"
          sed -i 's|package: "swift-issue-windows-existential-crash-other-package"|package: "other-package"|' "$primary/Package.swift"
          grep -n "url:\|package:" "$primary/Package.swift"
          bash .github/workflows/probe.sh "cross-package existential debug" "$primary" 1800 \
            'mangl|DebugInfo|Stack dump|Assertion failed' \
            swift build -c debug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-21
          path: ${{ runner.temp }}/probe-logs

  wasm-embedded:
    name: "Issues#65 · Wasm Embedded 6.4 · swift-index, swift-text"
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe
        shell: bash
        run: |
          swift --version
          swift sdk install \
            "https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum "f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d"
          swift sdk list
          sdk="$(swift sdk list | grep -m1 'wasm-embedded')"
          sig='MandatoryPerformanceOptimizations|isLegalSILType|eliminateDeadAllocations|Stack dump'
          for repo in swift-atoms/swift-index:Index swift-atoms/swift-text:Text; do
            path="${repo%%:*}"; target="${repo##*:}"; name="${path#*/}"
            git clone -q "https://github.com/$path.git" "$RUNNER_TEMP/$name"
            bash .github/workflows/probe.sh "$name target $target ($sdk)" "$RUNNER_TEMP/$name" 1800 "$sig" \
              swift build --swift-sdk "$sdk" --target "$target"
          done
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/Sources/Consumer"
          cat > "$consumer/Package.swift" <<'EOF'
          // swift-tools-version: 6.4
          import PackageDescription
          let package = Package(
              name: "Consumer",
              dependencies: [.package(url: "https://github.com/swift-atoms/swift-index.git", branch: "main")],
              targets: [.target(name: "Consumer", dependencies: [.product(name: "Index", package: "swift-index")])]
          )
          EOF
          sed -i 's/^          //' "$consumer/Package.swift"
          printf 'public import Index\npublic let x: Index<Int> = .zero + .zero\n' > "$consumer/Sources/Consumer/Crash.swift"
          bash .github/workflows/probe.sh "consumer Index zero plus zero ($sdk)" "$consumer" 1800 "$sig" \
            swift build --swift-sdk "$sdk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: probe-65
          path: ${{ runner.temp }}/probe-logs
