# SwiftLint configuration
# Inherits from the Swift Institute ecosystem-wide canonical configuration

parent_config: https://raw.githubusercontent.com/swift-institute/.github/main/.swiftlint.yml

# Package-specific overrides: this repository is a monorepo of independent
# reproducer packages (each its own Tests/ and Sources/Reproducer/), not a single Sources/Tests pair at the root, so the
# parent config's `included: [Sources, Tests]` matches nothing here. Widen
# back to the whole repository, keeping the parent's `excluded:`.
included:
  - .

excluded:
  - .build
  - "**/.build"
